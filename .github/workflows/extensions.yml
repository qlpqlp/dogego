#
# Build official extension zips, refresh catalog.json sha256 / download_url fields,
# and (on main) commit catalog updates so DogeGo nodes can detect new versions.
name: Extensions catalog

on:
  push:
    branches: [main, master]
    paths:
      - "DogeGo/extensions/catalog/**"
      - ".github/workflows/extensions.yml"
  pull_request:
    paths:
      - "DogeGo/extensions/catalog/**"
      - ".github/workflows/extensions.yml"
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    working-directory: DogeGo

jobs:
  build-catalog:
    name: Build extension zips + catalog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: DogeGo/go.sum

      - name: Build catalog packages
        env:
          CGO_ENABLED: "0"
        run: bash scripts/build_extensions_catalog.sh

      - name: Upload extension zips
        uses: actions/upload-artifact@v4
        with:
          name: dogego-extension-zips
          path: |
            DogeGo/extensions/catalog/*/dist/*.zip
          if-no-files-found: warn

      - name: Commit catalog hash updates (main only)
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        run: |
          cd "${GITHUB_WORKSPACE}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add DogeGo/extensions/catalog/catalog.json DogeGo/extensions/catalog/*/dist/*.zip || true
          if git diff --cached --quiet; then
            echo "No catalog changes to commit"
            exit 0
          fi
          git commit -m "chore(extensions): refresh catalog zips and hashes"
          git push
