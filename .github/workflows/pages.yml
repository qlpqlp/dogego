# Deploy dogego.org from docs/ on push to main.
name: GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "DogeGo/docs/**"
      - "DogeGo/DIPs/**"
      - "DogeGo/ROADMAP.md"
      - "DogeGo/extensions/catalog/**/*.md"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Sync documentation markdown into docs/md
        run: node docs/scripts/sync-guide-md.js
      - name: Build locale bundles
        run: node docs/scripts/build-locales.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
