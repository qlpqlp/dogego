# Build and publish DogeGo release binaries when a version tag is pushed (v*).
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

defaults:
  run:
    working-directory: DogeGo

jobs:
  build:
    name: Build ${{ matrix.asset }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: windows
            goarch: amd64
            ext: .exe
            asset: dogego-windows-amd64.exe
          - goos: linux
            goarch: amd64
            ext: ""
            asset: dogego-linux-amd64
          - goos: darwin
            goarch: amd64
            ext: ""
            asset: dogego-darwin-amd64
          - goos: darwin
            goarch: arm64
            ext: ""
            asset: dogego-darwin-arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: DogeGo/go.sum
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          mkdir -p dist
          go build -trimpath -ldflags="-s -w" -o "dist/${{ matrix.asset }}" ./cmd/dogego
      - name: SHA256 sidecar
        run: |
          cd dist
          sha256sum "${{ matrix.asset }}" > "${{ matrix.asset }}.sha256"
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: |
            DogeGo/dist/${{ matrix.asset }}
            DogeGo/dist/${{ matrix.asset }}.sha256

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: List release files
        run: find artifacts -type f | sort
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/**/*
