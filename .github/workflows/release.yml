# Build and publish DogeGo release binaries when a version tag is pushed (v*).
# Each OS uses a native runner so CGO can link the vendored Raccoon-G-44 port
# (libgmp + libmpfr). Cross-compiling CGO from Linux → Windows/macOS is not used.
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish a GitHub Release (only for tag pushes by default; set true for dry-run testing of upload paths)"
        type: boolean
        default: false

permissions:
  contents: write

defaults:
  run:
    working-directory: DogeGo

jobs:
  build:
    name: Build ${{ matrix.asset }}
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runs-on: ubuntu-latest
            goos: linux
            goarch: amd64
            asset: dogego-linux-amd64
          - runs-on: windows-latest
            goos: windows
            goarch: amd64
            asset: dogego-windows-amd64.exe
          # macos-13 retired; Intel CGO needs macos-15-intel (see actions/runner-images#13046).
          - runs-on: macos-15-intel
            goos: darwin
            goarch: amd64
            asset: dogego-darwin-amd64
          - runs-on: macos-15
            goos: darwin
            goarch: arm64
            asset: dogego-darwin-arm64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: DogeGo/go.sum

      # --- Linux: apt GMP/MPFR (+ zstd for Pebble CGO) ---
      - name: Install Raccoon-G deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libgmp-dev libmpfr-dev libzstd-dev

      # --- Windows: MSYS2 MinGW toolchain + GMP/MPFR/zstd ---
      - name: Setup MSYS2 (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          path-type: inherit
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-pkg-config
            mingw-w64-x86_64-gmp
            mingw-w64-x86_64-mpfr
            mingw-w64-x86_64-zstd

      # --- macOS: Homebrew GMP/MPFR/zstd ---
      - name: Install Raccoon-G deps (macOS)
        if: runner.os == 'macOS'
        run: brew install gmp mpfr zstd pkg-config

      - name: Build (Linux / macOS)
        if: runner.os != 'Windows'
        env:
          CGO_ENABLED: "1"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          set -euo pipefail
          mkdir -p dist
          if [ "${{ runner.os }}" = "macOS" ]; then
            export CGO_CFLAGS="-I$(brew --prefix gmp)/include -I$(brew --prefix mpfr)/include -I$(brew --prefix zstd)/include"
            export CGO_LDFLAGS="-L$(brew --prefix gmp)/lib -L$(brew --prefix mpfr)/lib -L$(brew --prefix zstd)/lib"
          fi
          go build -tags raccoon_g -trimpath -ldflags="-s -w" -o "dist/${{ matrix.asset }}" ./cmd/dogego
          # Smoke: binary must report raccoon backend when probed offline is heavy;
          # at least ensure the binary links and runs.
          ./dist/${{ matrix.asset }} version

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        env:
          CGO_ENABLED: "1"
          GOOS: windows
          GOARCH: amd64
        run: |
          set -euo pipefail
          export PATH="/mingw64/bin:$PATH"
          mkdir -p dist
          go build -tags raccoon_g -trimpath -ldflags="-s -w" -o "dist/${{ matrix.asset }}" ./cmd/dogego
          ./dist/${{ matrix.asset }} version

      - name: SHA256 sidecar (Unix)
        if: runner.os != 'Windows'
        run: |
          cd dist
          shasum -a 256 "${{ matrix.asset }}" | awk '{print $1}' > "${{ matrix.asset }}.sha256"
          # Prefer sha256sum when present (Linux)
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${{ matrix.asset }}" | awk '{print $1}' > "${{ matrix.asset }}.sha256"
          fi

      - name: SHA256 sidecar (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: DogeGo/dist
        run: |
          $h = (Get-FileHash -Algorithm SHA256 ./${{ matrix.asset }}).Hash.ToLower()
          Set-Content -NoNewline -Path ./${{ matrix.asset }}.sha256 -Value $h

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: |
            DogeGo/dist/${{ matrix.asset }}
            DogeGo/dist/${{ matrix.asset }}.sha256

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: List release files
        run: find artifacts -type f | sort
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/**/*
          body: |
            Official binaries include **Raccoon-G-44** (vendored libdogecoin in-tree port; CGO + libgmp/libmpfr) on Linux, Windows, and macOS.

            Falcon / Dilithium PQ also ship in all builds.
