# Compile-check Raccoon-G CGO builds on Linux / Windows / macOS (no release upload).
# Runs on PRs that touch pqcrypto or this workflow so release surprises are caught early.
name: Raccoon-G CGO

on:
  pull_request:
    paths:
      - "DogeGo/pqcrypto/**"
      - ".github/workflows/raccoon_g.yml"
      - ".github/workflows/release.yml"
  push:
    branches: [main, master]
    paths:
      - "DogeGo/pqcrypto/**"
      - ".github/workflows/raccoon_g.yml"
      - ".github/workflows/release.yml"
  workflow_dispatch:

defaults:
  run:
    working-directory: DogeGo

jobs:
  raccoon-cgo:
    name: raccoon_g ${{ matrix.os }}
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runs-on: ubuntu-latest
            os: linux
          - runs-on: windows-latest
            os: windows
          - runs-on: macos-15
            os: darwin-arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: DogeGo/go.sum

      - name: Deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libgmp-dev libmpfr-dev libzstd-dev

      - name: Deps (Windows / MSYS2)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          path-type: inherit
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-pkg-config
            mingw-w64-x86_64-gmp
            mingw-w64-x86_64-mpfr
            mingw-w64-x86_64-zstd

      - name: Deps (macOS)
        if: runner.os == 'macOS'
        run: brew install gmp mpfr zstd pkg-config

      - name: Test + build (Linux)
        if: runner.os == 'Linux'
        env:
          CGO_ENABLED: "1"
        run: |
          set -euo pipefail
          export CGO_LDFLAGS="-Wl,-Bstatic -lmpfr -lgmp -lzstd -Wl,-Bdynamic -lm -lpthread"
          go test -tags raccoon_g ./pqcrypto/ -run 'TestRaccoon|TestFalcon|TestDilithium' -count=1
          go test -tags raccoon_g ./consensus/ -run TestVerifyPQCarrierPairRaccoon -count=1
          go build -tags raccoon_g -o /tmp/dogego-raccoon ./cmd/dogego
          if ldd /tmp/dogego-raccoon | grep -E 'libmpfr\.|libgmp\.|libzstd\.'; then
            echo "::error::Linux binary still dynamically links libmpfr/libgmp/libzstd"
            ldd /tmp/dogego-raccoon
            exit 1
          fi
          /tmp/dogego-raccoon version

      - name: Test + build (macOS)
        if: runner.os == 'macOS'
        env:
          CGO_ENABLED: "1"
        run: |
          set -euo pipefail
          GMP="$(brew --prefix gmp)"
          MPFR="$(brew --prefix mpfr)"
          ZSTD="$(brew --prefix zstd)"
          for f in "$MPFR/lib/libmpfr.a" "$GMP/lib/libgmp.a" "$ZSTD/lib/libzstd.a"; do
            test -f "$f" || { echo "missing $f"; ls -la "$(dirname "$f")"; exit 1; }
          done
          STATIC_LIBDIR="$(pwd)/.ci-static-libs"
          rm -rf "$STATIC_LIBDIR"
          mkdir -p "$STATIC_LIBDIR"
          cp "$MPFR/lib/libmpfr.a" "$GMP/lib/libgmp.a" "$ZSTD/lib/libzstd.a" "$STATIC_LIBDIR/"
          export CGO_CFLAGS="-I${GMP}/include -I${MPFR}/include -I${ZSTD}/include"
          unset LIBRARY_PATH DYLD_LIBRARY_PATH PKG_CONFIG_PATH || true
          export CGO_LDFLAGS="-L${STATIC_LIBDIR} -lmpfr -lgmp -lzstd"
          go test -tags raccoon_g ./pqcrypto/ -run 'TestRaccoon|TestFalcon|TestDilithium' -count=1
          go test -tags raccoon_g ./consensus/ -run TestVerifyPQCarrierPairRaccoon -count=1
          go build -tags raccoon_g -o /tmp/dogego-raccoon ./cmd/dogego
          if otool -L /tmp/dogego-raccoon | grep -Ei 'libmpfr|libgmp|libzstd'; then
            echo "::error::macOS binary still links Homebrew dylibs"
            otool -L /tmp/dogego-raccoon
            exit 1
          fi
          /tmp/dogego-raccoon version

      - name: Test + build (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        env:
          CGO_ENABLED: "1"
        run: |
          export PATH="/mingw64/bin:$PATH"
          export CGO_LDFLAGS="-Wl,-Bstatic -lmpfr -lgmp -lzstd -Wl,-Bdynamic -lbcrypt -static-libgcc"
          go test -tags raccoon_g ./pqcrypto/ -run 'TestRaccoon|TestFalcon|TestDilithium' -count=1
          go test -tags raccoon_g ./consensus/ -run TestVerifyPQCarrierPairRaccoon -count=1
          go build -tags raccoon_g -o dogego-raccoon.exe ./cmd/dogego
          if objdump -p dogego-raccoon.exe | grep -Ei 'DLL Name:.*(libmpfr|libgmp|libzstd)'; then
            echo "::error::Windows binary still imports MinGW DLLs"
            exit 1
          fi
          PATH="/usr/bin:/bin" ./dogego-raccoon.exe version
